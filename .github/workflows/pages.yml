name: Validate and deploy static site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check results.js
          node --check consistency.js
          node --check results-core.js
          node --check summary.js
          node --check conclusions.js
          node --check recommendations.js
          node --check bibliography.js
          node --check annexes.js
          node --check workflow-ui.js
          node --check periods-global.js
          node --check careers-simple.js
          node --check template-workbench.js
          node --check document-core.js
          node --check dnc-calculations.js
          node --check dnc-manifest.js
          node --check institutional-governance.js
          node --check import-hardening.js
          node --check official-snapshots.js
          node --check document-layout.js
          node --check tests/architecture-smoke.mjs
          node --check tests/calculations-smoke.mjs
          node --check tests/hardening-smoke.mjs
          node --check tests/document-layout-smoke.mjs
          node --check tests/legacy-public-entry-smoke.mjs
      - name: Run smoke tests
        run: |
          node tests/architecture-smoke.mjs
          node tests/calculations-smoke.mjs
          node tests/hardening-smoke.mjs
          node tests/document-layout-smoke.mjs
          node tests/legacy-public-entry-smoke.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
