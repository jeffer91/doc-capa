name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check results.js
          node --check consistency.js
          node --check results-core.js
          node --check summary.js
          node --check conclusions.js
          node --check recommendations.js
          node --check bibliography.js
          node --check annexes.js
          node --check workflow-ui.js
          node --check periods-global.js
          node --check careers-simple.js
          node --check template-workbench.js
          node --check document-core.js
          node --check dnc-manifest.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
